<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MyTickTick</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app">
        <header id="site-header"></header>
        <main id="site-main">
            <div class="page">
                <h2 class="page-title">Dashboard</h2>
                <div class="dashboard-filters">
                    <label>Mes: <select id="metric-month"></select></label>
                    <label>A&ntilde;o: <select id="metric-year"></select></label>
                    <button type="button" class="btn" onclick="loadDashboard()">Actualizar</button>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>Tareas Mensuales Cumplidas</h3>
                        <p id="monthly-completion-rate">Cargando...</p>
                    </div>
                    <div class="metric-card">
                        <h3>Tareas Inmediatas Pendientes</h3>
                        <p id="immediate-pending-count">Cargando...</p>
                    </div>
                    <div class="metric-card">
                        <h3>Trackers Activos</h3>
                        <p id="active-trackers-count">Cargando...</p>
                    </div>
                </div>

                <div class="metrics-table-block">
                    <h3>Métricas de cumplimiento &middot; <span id="metrics-period-label"></span></h3>
                    <div id="metrics-table-wrap">
                        <p class="empty-state">Cargando métricas...</p>
                    </div>
                </div>

                <div class="charts-grid">
                    <div class="chart-container">
                        <h3>Cumplimiento Mensual de Tareas</h3>
                        <canvas id="monthly-chart"></canvas>
                    </div>
                </div>

                <div class="tracker-carousel-block">
                    <div class="tracker-carousel-header">
                        <h3>Evolución de Trackers</h3>
                        <div class="tracker-carousel-nav">
                            <button type="button" class="carousel-btn" onclick="scrollTrackerCarousel(-1)" aria-label="Tracker anterior">&#8249;</button>
                            <button type="button" class="carousel-btn" onclick="scrollTrackerCarousel(1)" aria-label="Tracker siguiente">&#8250;</button>
                        </div>
                    </div>
                    <p class="chart-key">
                        <span><span class="chart-key__swatch chart-key__swatch--met"></span>Cumplió</span>
                        <span><span class="chart-key__swatch chart-key__swatch--miss"></span>No cumplió</span>
                        <span><span class="chart-key__swatch chart-key__swatch--limit"></span>Límite</span>
                    </p>
                    <div class="tracker-carousel" id="tracker-carousel"></div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/layout.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
